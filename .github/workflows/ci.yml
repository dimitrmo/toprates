name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete, except on
# master, where the run bumps the version and cuts a release: cancelling it
# half-way could leave a tag without a release attached to it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # package-lock.json is committed, so the linter version is pinned and the
      # install is restored from cache on most runs.
      - name: Install lint dependencies
        run: npm ci

      - name: Run ESLint
        run: npx eslint .

  test:
    name: Validate sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install GNOME build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin gettext zip unzip

      - name: Run test suite
        run: ./tests/run-tests.sh

  # Branch and pull-request builds get a downloadable zip for manual testing but
  # no version bump. On master the release job below does the packing instead,
  # so that the zip it publishes is built from the bumped commit.
  pack:
    name: Pack extension zip
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: ${{ !(github.event_name == 'push' && github.ref == 'refs/heads/master') }}
    steps:
      - uses: actions/checkout@v4

      - name: Install GNOME build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin gettext zip unzip

      # One archive, for the shell versions metadata.json advertises. It is the
      # single upload extensions.gnome.org takes for this UUID.
      - name: Build zip
        run: |
          uuid="$(python3 -c 'import json;print(json.load(open("metadata.json"))["uuid"])')"
          ./tools/pack.sh --output "dist/${uuid}.shell-extension.zip"

      # Unpacking here would defeat the purpose: the artifact must stay a zip
      # that can be uploaded to extensions.gnome.org as-is, so it is uploaded
      # with compression disabled.
      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: shell-extension-zip-${{ github.sha }}
          path: dist/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 30

  release:
    name: Bump version and release
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the bump commit pushes as a fast-forward, and so the
          # release notes can be generated against the previous tag.
          fetch-depth: 0

      - name: Install GNOME build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libglib2.0-bin gettext zip unzip

      - name: Configure git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Bump patch version, commit and tag
        id: bump
        run: |
          set -euo pipefail
          # Another merge can land while this job is running, which would make
          # the push a non-fast-forward. Rather than failing the release, start
          # over from whatever is on master now and bump again. The commit and
          # the tag go up in one --atomic push so a rejected push never leaves a
          # tag behind pointing at an unreleased commit.
          for attempt in 1 2 3; do
            git fetch --tags origin master
            git reset --hard origin/master

            version="$(./tools/version.sh bump)"
            git add metadata.json package.json package-lock.json
            git commit -m "chore(release): v${version} [skip ci]"
            git tag -f "v${version}"

            if git push --atomic origin "HEAD:refs/heads/master" "refs/tags/v${version}"; then
              echo "version=${version}" >> "$GITHUB_OUTPUT"
              echo "Released v${version}" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            echo "::warning::push rejected on attempt ${attempt}; master moved, retrying"
          done
          echo "::error::could not push the version bump after 3 attempts"
          exit 1

      # One archive, for the shell versions metadata.json advertises. It is the
      # single upload extensions.gnome.org takes for this UUID.
      - name: Build zip
        run: |
          uuid="$(python3 -c 'import json;print(json.load(open("metadata.json"))["uuid"])')"
          ./tools/pack.sh --output "dist/${uuid}.shell-extension.zip"

      - name: Upload zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: shell-extension-zip-v${{ steps.bump.outputs.version }}
          path: dist/*.zip
          compression-level: 0
          if-no-files-found: error
          retention-days: 90

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          name: v${{ steps.bump.outputs.version }}
          files: dist/*.zip
          generate_release_notes: true
          body: |
            `*.shell-extension.zip` — GNOME Shell 48-50. Upload it as-is at
            https://extensions.gnome.org/upload/.
